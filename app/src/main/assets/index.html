<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mohasiba</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#17212b}header{background:#1565c0;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}main{padding:14px;max-width:760px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.btn{border:0;border-radius:10px;padding:10px 13px;font-size:14px;cursor:pointer}.primary{background:#1565c0;color:#fff}.danger{background:#d32f2f;color:#fff}.light{background:#eef2f6}.input{width:100%;padding:11px;border:1px solid #d6dce2;border-radius:9px;font-size:15px;margin:5px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.muted{color:#687684;font-size:13px}.amount{font-size:20px;font-weight:bold}.debt{color:#c62828}.credit{color:#2e7d32}.settled{color:#546e7a}.record{border-top:1px solid #edf0f3;padding:12px 0}.record:first-child{border-top:0}.actions{display:flex;gap:6px;margin-top:7px}.empty{text-align:center;padding:35px 10px;color:#71808c}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:100}.modalBox{background:#fff;border-radius:14px;padding:18px;max-width:360px;width:calc(100% - 32px);box-shadow:0 8px 30px #0005}.modalBox h3{margin:0 0 10px}.modalActions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}.back{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;margin-left:8px}.titleRow{display:flex;align-items:center}.small{font-size:12px}.search{margin-bottom:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.summary .card{margin:0;text-align:center;padding:10px}.fab{position:fixed;bottom:22px;left:20px;border-radius:50%;width:56px;height:56px;font-size:28px;box-shadow:0 4px 12px #0003}
</style></head><body><header><div class="titleRow"><button id="back" class="back hidden" onclick="home()">‹</button><h1 id="title">Mohasiba — حساب قرض</h1></div></header><main id="app"></main><button id="fab" class="btn primary fab" onclick="showCustomerForm()">+</button>
<script>
const KEY='mohasiba_v1'; let db=JSON.parse(localStorage.getItem(KEY)||'{"customers":[]}'); let current=null; let page='home';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)); const money=n=>new Intl.NumberFormat('fa-AF').format(Math.abs(n||0));
function localDateTimeValue(d=new Date()){const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function balance(c){return c.records.reduce((s,r)=>s+(r.type==='debt'?Number(r.amount):-Number(r.amount)),0)}
function status(b){return b>0?`مشتری بدهکار است: ${money(b)} افغانی`:b<0?`دکان بدهکار است: ${money(b)} افغانی`:'حساب تصفیه شده است'}
function home(){current=null;page='home';document.getElementById('back').classList.add('hidden');document.getElementById('title').textContent='Mohasiba — حساب قرض';document.getElementById('fab').classList.remove('hidden');renderHome()}
function goBack(){if(page==='home')return false;if(page==='recordForm'||page==='customerForm'){if(current){openCustomer(current)}else{home()}return true;}if(page==='customer'){home();return true;}home();return true}
function renderHome(filter=''){document.getElementById('app').innerHTML=`<div class="card"><div class="row"><input id="search" class="input search" placeholder="جستجوی مشتری..." value="${esc(filter)}" autocomplete="off" oninput="updateSearch(this.value)" onkeydown="if(event.key==='Enter'){updateSearch(this.value)}"></div><button class="btn primary" onclick="showCustomerForm()">+ مشتری جدید</button> <button class="btn light" onclick="backupData()">پشتیبان‌گیری</button> <button class="btn light" onclick="document.getElementById('restore').click()">بازیابی</button><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"></div><div id="customerList"></div>`;updateSearch(filter,false)}
function updateSearch(filter='',focusInput=true){let list=db.customers.filter(c=>(String(c.name||'')+' '+String(c.phone||'')).toLocaleLowerCase().includes(String(filter||'').toLocaleLowerCase()));const el=document.getElementById('customerList');if(!el)return;el.innerHTML=list.length?list.map(c=>{let b=balance(c);return `<div class="card" onclick="openCustomer('${c.id}')"><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'بدون شماره')}</div></div><div class="amount ${b>0?'debt':b<0?'credit':'settled'}">${money(b)} افغانی</div></div><div class="muted" style="margin-top:7px">${status(b)}</div></div>`}).join(''):'<div class="card empty">مشتری مورد نظر پیدا نشد.</div>';if(focusInput){const input=document.getElementById('search');if(input){input.focus();const pos=input.value.length;try{input.setSelectionRange(pos,pos)}catch(e){}}}}
function esc(s){return String(s||'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}
function showCustomerForm(editId=null){page='customerForm';let c=editId?db.customers.find(x=>x.id===editId):null;document.getElementById('fab').classList.add('hidden');document.getElementById('back').classList.remove('hidden');document.getElementById('title').textContent=c?'ویرایش مشتری':'مشتری جدید';document.getElementById('app').innerHTML=`<div class="card"><label>نام مشتری</label><input id="name" class="input" value="${esc(c?.name||'')}"><label>شماره تلفن</label><input id="phone" class="input" value="${esc(c?.phone||'')}"><label>توضیحات</label><input id="note" class="input" value="${esc(c?.note||'')}"><button class="btn primary" onclick="saveCustomer('${editId||''}')">ذخیره</button> <button class="btn light" onclick="home()">انصراف</button></div>`}
function backupData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mohasiba-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.customers))throw 0;if(!confirm('اطلاعات فعلی با نسخه پشتیبان جایگزین شود؟'))return;db=x;save();home();alert('بازیابی با موفقیت انجام شد.')}catch(_){alert('فایل پشتیبان معتبر نیست.')}};r.readAsText(f);e.target.value=''}
function saveCustomer(id){let name=document.getElementById('name').value.trim();if(!name)return alert('نام مشتری را وارد کنید.');let c=id?db.customers.find(x=>x.id===id):{id:Date.now().toString(),records:[]};c.name=name;c.phone=document.getElementById('phone').value.trim();c.note=document.getElementById('note').value.trim();if(!id)db.customers.push(c);save();openCustomer(c.id)}
function openCustomer(id){current=id;page='customer';let c=db.customers.find(x=>x.id===id);document.getElementById('back').classList.remove('hidden');document.getElementById('fab').classList.add('hidden');document.getElementById('title').textContent=c.name;renderCustomer(c)}
function renderCustomer(c){let b=balance(c), debts=c.records.filter(r=>r.type==='debt').reduce((s,r)=>s+Number(r.amount),0), pays=c.records.filter(r=>r.type==='payment').reduce((s,r)=>s+Number(r.amount),0);let records=[...c.records].sort((a,b)=>(new Date(b.createdAt||b.date).getTime())-(new Date(a.createdAt||a.date).getTime()));let run=0;let chronological=[...c.records].sort((a,b)=>(new Date(a.createdAt||a.date).getTime())-(new Date(b.createdAt||b.date).getTime()));let rb={};chronological.forEach(r=>{run+=r.type==='debt'?Number(r.amount):-Number(r.amount);rb[r.id]=run});document.getElementById('app').innerHTML=`<div class="card"><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'بدون شماره')}</div></div><button class="btn light" onclick="showCustomerForm('${c.id}')">✏️ ویرایش</button></div><div style="margin-top:12px" class="amount ${b>0?'debt':b<0?'credit':'settled'}">${status(b)}</div></div><div class="summary"><div class="card"><div class="small">قرض‌ها</div><b>${money(debts)}</b></div><div class="card"><div class="small">پرداخت‌ها</div><b>${money(pays)}</b></div><div class="card"><div class="small">مانده</div><b>${money(b)}</b></div></div><div class="card"><div class="row" style="margin-bottom:10px"><button class="btn primary" onclick="showRecordForm('debt')">+ قرض جدید</button><button class="btn light" onclick="showRecordForm('payment')">+ دریافت پرداخت</button></div>${records.length?records.map(r=>recordHtml(r,rb[r.id])).join(''):'<div class="empty">برای این مشتری هنوز رکوردی ثبت نشده است.</div>'}</div><button class="btn danger" onclick="askDeleteCustomer('${c.id}')">حذف مشتری</button>`}
function recordHtml(r,run){return `<div class="record"><div class="row between"><div><b>${r.type==='debt'?'قرض جدید':'پرداخت مشتری'}</b><div class="muted">${new Date(r.date).toLocaleString('fa-AF')}</div></div><div class="amount ${r.type==='debt'?'debt':'credit'}">${r.type==='debt'?'+':'−'} ${money(r.amount)}</div></div>${r.note?`<div class="muted">یادداشت: ${esc(r.note)}</div>`:''}<div class="muted">مانده پس از رکورد: <b>${money(run)} افغانی</b> ${run>0?'بدهکار مشتری':run<0?'بدهکار دکان':'تصفیه'}</div><div class="actions"><button class="btn light" onclick="showRecordForm('${r.type}','${r.id}')">✏️ ویرایش</button><button class="btn danger" onclick="askDeleteRecord('${r.id}')">🗑️ حذف</button></div></div>`}
function showRecordForm(type,id=null){page='recordForm';let c=db.customers.find(x=>x.id===current),r=id?c.records.find(x=>x.id===id):null;document.getElementById('title').textContent=r?'ویرایش رکورد':(type==='debt'?'قرض جدید':'پرداخت مشتری');document.getElementById('app').innerHTML=`<div class="card"><label>مبلغ (افغانی)</label><input id="amount" class="input" type="number" min="0" value="${r?.amount||''}"><label>تاریخ و ساعت</label><input id="date" class="input" type="datetime-local" value="${r?localDateTimeValue(new Date(r.date)):localDateTimeValue()}"><label>توضیحات</label><input id="rnote" class="input" value="${esc(r?.note||'')}"><button class="btn primary" onclick="saveRecord('${type}','${id||''}')">ذخیره</button> <button class="btn light" onclick="openCustomer('${current}')">انصراف</button></div>`}
function saveRecord(type,id){let c=db.customers.find(x=>x.id===current), amount=Number(document.getElementById('amount').value);if(!amount||amount<0)return alert('مبلغ معتبر وارد کنید.');let r=id?c.records.find(x=>x.id===id):{id:Date.now().toString()};r.type=type;r.amount=amount;const dateValue=document.getElementById('date').value;if(!dateValue)return alert('تاریخ و ساعت معتبر نیست.');const localDate=new Date(dateValue);if(Number.isNaN(localDate.getTime()))return alert('تاریخ و ساعت معتبر نیست.');r.date=localDate.toISOString();if(!id)r.createdAt=new Date().toISOString();r.note=document.getElementById('rnote').value.trim();if(!id)c.records.push(r);save();openCustomer(current)}
function showDeleteConfirm(message,onYes){
  const old=document.getElementById('deleteModal');
  if(old)old.remove();
  const m=document.createElement('div');m.id='deleteModal';m.className='modal';
  m.innerHTML=`<div class="modalBox"><h3>تأیید حذف</h3><div>${esc(message)}</div><div class="modalActions"><button id="deleteYes" class="btn danger">حذف</button><button id="deleteNo" class="btn light">انصراف</button></div></div>`;
  document.body.appendChild(m);
  document.getElementById('deleteNo').onclick=()=>m.remove();
  document.getElementById('deleteYes').onclick=()=>{m.remove();onYes();};
}
function askDeleteRecord(id){showDeleteConfirm('آیا مطمئن هستید که این رکورد حذف شود؟',()=>deleteRecord(id));}
function askDeleteCustomer(id){showDeleteConfirm('تمام حساب‌های این مشتری حذف می‌شود. ادامه می‌دهید؟',()=>deleteCustomer(id));}
function deleteRecord(id){let c=db.customers.find(x=>x.id===current);if(!c)return;const before=c.records.length;c.records=c.records.filter(r=>String(r.id)!==String(id));if(c.records.length===before){return;}save();renderCustomer(c)}
function deleteCustomer(id){const before=db.customers.length;db.customers=db.customers.filter(c=>String(c.id)!==String(id));if(db.customers.length===before){return;}save();home()}
renderHome(); window.handleAndroidBack=goBack;
</script></body></html>
